name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest numpy soundfile
      - name: Tests
        run: python -m pytest -q
      - name: Agent files in sync with AGENTS.md, commands/ and VERSION
        run: python scripts/sync-agents.py --check
      - name: Brand guard
        run: python scripts/brand-guard.py
      - name: Manifests parse
        shell: python
        run: |
          import json, pathlib
          for p in ["plugin.json", "gemini-extension.json", "opencode.json", ".claude-plugin/plugin.json",
                    ".claude-plugin/marketplace.json", ".agents/plugins/marketplace.json", ".cursor-plugin/plugin.json"]:
              json.loads(pathlib.Path(p).read_text(encoding="utf-8"))
              print("ok", p)
